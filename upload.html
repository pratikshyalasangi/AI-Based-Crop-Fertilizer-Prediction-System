<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload | Smart Krushi</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
 
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">🌾 Smart Krushi</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="otp.html">OTP</a></li>
          <li class="nav-item"><a class="nav-link active" href="upload.html">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="result.html">Result</a></li>
        </ul>
      </div>
    </div>
  </nav>

  
  <div class="main-container">
    <h2>Upload Crop Image</h2>

   
    <div class="file-btns">
      <label class="file-btn" title="Capture from Camera">
        <i class="fa-solid fa-camera"></i>
        <input type="file" accept="image/*" capture="camera" id="cropImage" />
      </label>
      <label class="file-btn" title="Select from Gallery">
        <i class="fa-solid fa-image"></i>
        <input type="file" accept="image/*" id="cropImageGallery" />
      </label>
    </div>

 
    <img id="previewImage" alt="Preview" />

    <button class="btn btn-primary mt-3" onclick="predictCrop()">Predict</button>
  </div>

 
  <script src="script.js"></script>
</body>
</html>
