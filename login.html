<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Smart Krushi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">🌾 Smart Krushi</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="otp.html">OTP</a></li>
          <li class="nav-item"><a class="nav-link" href="upload.html">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="result.html">Result</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <h2>Login</h2>

    <form onsubmit="event.preventDefault(); loginUser();">
      <input type="email" id="loginEmail" placeholder="Email Address" class="form-control mb-3" required />
      
      <div class="password-field">
        <input type="password" id="loginPassword" placeholder="Password" class="form-control mb-3" required />
        <i class="fa-solid fa-eye" id="toggleLoginPw" onclick="togglePassword('loginPassword', this)"></i>
      </div>

      <p id="loginMsg" class="text-danger small"></p>
      <button type="submit" class="btn btn-primary">Login</button>
      <button type="button" class="btn btn-secondary" onclick="forgotPassword()">Forgot Password</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
